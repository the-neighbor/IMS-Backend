spring:
  application:
    name: UserAuth
  datasource:
    url: ${MM_IMS_DB_URL}
    username: ${MM_IMS_DB_USER}
    password: ${MM_IMS_DB_PASS}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    database: mysql
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
    
eureka:
 client:
  service-url:
   defaultZone: http://localhost:8761/eureka/
      
server:
  port: 9890