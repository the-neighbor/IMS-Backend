server:
  port: 9090
  
spring:
  application:
    name: supplier
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MM_IMS_DB_URL}
    username: ${MM_IMS_DB_USER}
    password: ${MM_IMS_DB_PASS}

    
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
